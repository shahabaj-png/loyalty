[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["DATABASE_URL=\"postgresql://postgres:postgres@localhost:5432/loyalty\" npx prisma generate", "npm run build"]

[start]
cmd = "chmod +x start.sh && ./start.sh"

[variables]
NODE_ENV = "production"

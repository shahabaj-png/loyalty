[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["cd backend && npm ci"]

[phases.build]
cmds = ["cd backend && npx prisma generate && npm run build"]

[start]
cmd = "cd backend && npm run start:railway"

[variables]
NODE_ENV = "production"
DATABASE_URL = "postgresql://postgres:postgres@localhost:5432/loyalty?schema=public"
